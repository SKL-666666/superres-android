name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runner 已预装 Android SDK，无需 setup-android
      - name: Show Android env
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_HOME || true
          ls $ANDROID_HOME/ndk || true

      - name: Cache ncnn
        id: cache-ncnn
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/ncnn-android
          key: ncnn-android-20261020

      - name: Download ncnn (android prebuilt)
        if: steps.cache-ncnn.outputs.cache-hit != 'true'
        run: |
          set -e
          cd app/src/main/cpp
          TAG=$(curl -fsSL https://api.github.com/repos/Tencent/ncnn/releases/latest | grep -m1 '"tag_name"' | cut -d'"' -f4)
          echo "ncnn tag = $TAG"
          curl -fL -o ncnn.zip "https://github.com/Tencent/ncnn/releases/download/${TAG}/ncnn-${TAG}-android-vulkan.zip"
          unzip -q ncnn.zip
          mv "ncnn-${TAG}-android-vulkan" ncnn-android
          ls ncnn-android/lib/arm64-v8a/ | head

      - name: Verify ncnn layout
        run: |
          ls -la app/src/main/cpp/ncnn-android
          find app/src/main/cpp/ncnn-android/arm64-v8a -maxdepth 2 | head -30
          find app/src/main/cpp/ncnn-android -maxdepth 3 -name '*.h' | head -10

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SuperRes-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SuperRes v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
