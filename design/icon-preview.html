<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
body{background:#1a1a1c;display:flex;gap:30px;padding:40px;align-items:center;
  justify-content:center;flex-wrap:wrap;font-family:sans-serif}
.wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.lbl{color:#888;font-size:12px}
.ic{width:120px;height:120px;border-radius:26px;overflow:hidden;
  box-shadow:0 10px 30px -8px #000}
.ic svg{width:100%;height:100%;display:block}
.round .ic{border-radius:60px}
.squircle .ic{border-radius:28px}
</style></head><body>

<div class="wrap squircle">
  <div class="ic">
    <svg viewBox="0 0 108 108">
      <rect width="108" height="108" fill="#fff"/>
      <!-- 画面框 -->
      <path d="M30,30 L30,26 A4,4 0 0 1 34,22 L74,22 A4,4 0 0 1 78,26 L78,74
               A4,4 0 0 1 74,78 L34,78 A4,4 0 0 1 30,74 L30,68"
            fill="none" stroke="#6C5CE7" stroke-width="3.2"
            stroke-linecap="round" stroke-linejoin="round"/>
      <!-- 山 -->
      <path d="M30,62 L42,48 L51,57 L63,43 L78,60"
            fill="none" stroke="#6C5CE7" stroke-width="3.2"
            stroke-linecap="round" stroke-linejoin="round"/>
      <!-- 太阳 -->
      <circle cx="40" cy="34" r="4.5" fill="#6C5CE7"/>
      <!-- 放大镜柄 -->
      <path d="M68,68 L82,82" stroke="#1C1C1E" stroke-width="4.2" stroke-linecap="round"/>
      <!-- 放大镜圈 -->
      <circle cx="62" cy="62" r="13" fill="#fff" stroke="#1C1C1E" stroke-width="4.2"/>
      <!-- 加号 -->
      <path d="M62,56.5 L62,67.5 M56.5,62 L67.5,62"
            stroke="#6C5CE7" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="lbl">圆角方形</div>
</div>

<div class="wrap round">

      <circle cx="62" cy="62" r="13" fill="#fff" stroke="#1C1C1E" stroke-width="4.2"/>
      <path d="M62,56.5 L62,67.5 M56.5,62 L67.5,62"
            stroke="#6C5CE7" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="lbl">圆形</div>
</div>

</body></html>
